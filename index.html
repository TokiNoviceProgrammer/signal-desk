{id:`d4`,important:true,country:`JP`,tick:`6594.T`,sector:`motor`,name:T(`ニデック`,`Nidec`,`니덱`),date:`10/09`,px:`¥2,010`,chg:-6.07,
 why:T(`2026年3月期有報でPwCジャパンが3度目の「意見不表明」。上場廃止リスク懸念で年初来安値`,`PwC Japan declined to give an opinion on its FY2026/3 filing for the third time; delisting-risk fears sent shares to a 52-week low`,`2026년 3월기 유보에서 PwC재팬이 세 번째 '의견 불표명'. 상장폐지 우려로 연중 최저치`),
 d:T(`ニデックは9/30の取引終了後、2026年3月期の有価証券報告書を提出したが、監査法人PwCジャパンは3度目となる「意見不表明」の判定を下した。不適切な会計処理を受けた人事的な是正措置が一部完了しておらず、不正に関与した役職員の一部が依然財務報告プロセスで責任ある立場にあることなどから、「意見表明の基礎となる十分かつ適切な監査証拠を入手できなかった」という。これを受け10/1の株価は急落し年初来安値を更新、上場廃止リスクを警戒した処分売りが広がった。`,
     `After Tokyo trading closed on 9/30, Nidec filed its FY2026/3 annual securities report, but auditor PwC Japan declined to give an opinion for the third time, saying it could not obtain sufficient appropriate audit evidence — citing incomplete personnel remediation over earlier improper accounting and the fact that some staff involved in the misconduct still hold responsible roles in financial reporting. Shares plunged to a 52-week low on 10/1 as investors sold on fears of a possible delisting.`,
     `니덱은 9/30 거래 종료 후 2026년 3월기 유가증권보고서를 제출했지만, 감사법인 PwC재팬은 세 번째로 '의견 불표명' 판정을 내렸다. 부적절한 회계처리에 대한 인사 시정조치가 일부 완료되지 않았고, 부정에 관여한 일부 임직원이 여전히 재무보고 과정에서 책임 있는 위치에 있어 '의견 표명의 근거가 되는 충분하고 적절한 감사 증거를 입수할 수 없었다'고 한다. 이를 받아 10/1 주가는 급락해 연중 최저치를 경신했고, 상장폐지 우려에 따른 처분 매물이 확산됐다.`),
 src:[[`Bloomberg`,`https://www.bloomberg.com/jp/news/articles/2026-10-01/TM7D1LKJH6V400`],[`株探`,`https://s.kabutan.jp/news/n202610010350/`]]},
{id:`d1`,important:true,country:`JP`,tick:`4755.T`,sector:`telecom`,name:T(`楽天グループ`,`Rakuten Group`,`라쿠텐 그룹`),date:`10/09`,px:`¥659.6`,chg:1.44,
 why:T(`フィンテック事業再編に伴う法人所得税費用の計上を発表し軟調。年初来安値圏が続く`,`Weak after disclosing a corporate income-tax charge tied to its fintech business reorganization; shares remain near 52-week lows`,`핀테크 사업 재편에 따른 법인소득세 비용 계상을 발표해 약세. 연중 최저치권이 이어짐`),
 d:T(`楽天グループ株は9/28に一時677.3円まで下げ年初来安値を更新し、同日終値は687.8円(前日比+1.12%)。8/10発表の2026年1〜6月期決算はIFRS営業損益が504億円の黒字に転換したもののQUICKコンセンサス(708億円)に届かず10%超安。その後も戻りは鈍く、9/10〜11には米系大手証券2社が目標株価をそれぞれ800円、850円へ引き下げた。9/28時点の株価687.8円は、年初来高値(1/13、1,026円)から約33%低い水準。楽天モバイルの2026年通期設備投資は約2,000億円規模の計画で黒字化には時間がかかる見通しに加え、2025年12月期は無配、配当再開時期も「未定」としており、株主還元への不透明感が株価の重荷になっているとされる。`,
     `Rakuten Group shares hit a new 52-week low of ¥677.3 on 9/28 before closing at ¥687.8 that day (+1.12%). Results reported 8/10 for January-June 2026 showed IFRS operating profit swing to a gain of ¥50.4B, but that missed the QUICK consensus of ¥70.8B and shares fell over 10% that day. The stock has struggled to recover since, and on 9/10-11 two major US brokerages cut their targets to ¥800 and ¥850. The 9/28 price of ¥687.8 sits roughly 33% below the 52-week high of ¥1,026 (1/13). Rakuten Mobile's FY2026 capex plan of roughly ¥200B means profitability is still some way off, and with no dividend paid for FY2025 and no timeline set to resume one, shareholder-return uncertainty is seen weighing on the stock.`,
     `라쿠텐 그룹 주가는 9/28 한때 677.3엔까지 내려 연중 최저치를 경신했고, 같은 날 종가는 687.8엔(전일 대비 +1.12%)이었다. 8/10 발표된 2026년 1~6월기 실적은 IFRS 영업손익이 504억 엔 흑자로 전환했지만 QUICK 컨센서스(708억 엔)에 못 미쳐 당일 10% 넘게 급락했다. 이후에도 반등은 더뎠고, 9/10~11에는 미국계 대형 증권사 2곳이 목표주가를 각각 800엔, 850엔으로 하향했다. 9/28 기준 주가 687.8엔은 연중 고점(1/13, 1,026엔) 대비 약 33% 낮은 수준이다. 라쿠텐 모바일의 2026 회계연도 설비투자 계획은 약 2,000억 엔 규모로 흑자 전환까지는 시간이 걸릴 전망이며, 2025년 12월기 무배당에 배당 재개 시기도 '미정'이라 주주환원 불확실성이 주가에 부담이 되고 있다.`),
 src:[[`Yahoo!ファイナンス`,`https://finance.yahoo.co.jp/quote/4755.T/history`],[`松井証券`,`https://finance.matsui.co.jp/stock/4755/index`]]},
{id:`d5`,important:true,country:`JP`,tick:`9984.T`,sector:`invest`,name:T(`ソフトバンクグループ`,`SoftBank Group`,`소프트뱅크그룹`),date:`10/09`,px:`¥5,803`,chg:-3.92,
 why:T(`OpenAIへの300億ドル投資完了で再評価、CDS上昇やEMネットジャパン元CFO逮捕も重し`,`Reassessed after completing its $30B OpenAI investment program; rising CDS spreads and a former subsidiary CFO's arrest also weighed`,`OpenAI向け 300억 달러 투자 완료로 재평가, CDS 상승과 EM네트재팬 전 CFO 체포도 부담`),
 d:T(`ソフトバンクグループ株は10/2に6.0%安の6,296円で取引を終えた。総額300億ドルに上るOpenAIへの投資プログラムが完了したことを受け市場が株価を再評価したことに加え、同社のクレジット・デフォルト・スワップ(CDS)が2023年以来の高水準に急上昇しAI投資を賄う積極的なレバレッジ戦略への不安が広がった。さらに子会社EMネットジャパンの元CFOが10/1に逮捕され約1億7,000万円の横領事件が発覚したこともガバナンス面の懸念材料となった。前日に大幅高となった日経225全体の利益確定売りの流れも重なった。`,
     `SoftBank Group shares fell 6.0% to ¥6,296 on 10/2. The stock was reassessed after the company completed its $30 billion OpenAI investment program, while credit default swaps on the company spiked to their highest level since 2023, stoking concern over the aggressive leverage used to fund its AI bets. A separate governance concern emerged after the former CFO of subsidiary EM Net Japan was arrested on 10/1 over an embezzlement case involving roughly ¥170 million. The decline also coincided with broader profit-taking after the Nikkei 225's sharp rise the prior day.`,
     `소프트뱅크그룹 주가는 10/2 6.0% 하락한 6,296엔으로 거래를 마쳤다. 총 300억 달러 규모의 OpenAI 투자 프로그램이 완료된 데 따라 시장이 주가를 재평가했고, 회사의 신용부도스와프(CDS)가 2023년 이후 최고 수준으로 급등해 AI 투자를 뒷받침하는 적극적인 레버리지 전략에 대한 불안이 확산됐다. 자회사 EM네트재팬의 전 CFO가 10/1 약 1억7,000만 엔 횡령 사건으로 체포된 것도 거버넌스 우려 요인이 됐다. 전일 큰 폭으로 오른 닛케이225 전반의 이익 확정 매물 흐름도 겹쳤다.`),
 src:[[`日本経済新聞`,`https://www.nikkei.com/`],[`Investing.com`,`https://jp.investing.com/news/stock-market-news`]]},
{id:`d2`,country:`US`,tick:`SOUN`,sector:`voice`,name:T(`サウンドハウンドAI`,`SoundHound AI`,`사운드하운드 AI`),date:`10/06`,px:`$5.72`,chg:-2.72,
 why:T(`52週高値から急落。増収は続くも採算・インサイダー売却への懸念で年初来安値圏`,`Down sharply from its 52-week high; revenue keeps growing but margin worries and insider sales weigh, near 52-week lows`,`52주 고점 대비 급락. 매출 증가는 계속되나 수익성·내부자 매도 우려로 연중 저점권`),
 d:T(`SoundHound AIは2026年に入って年初来で約20〜30%下落しており、52週高値$22.17(2025/10/14)からは直近安値圏の$5.93(9/21)まで約73%の下落。第2四半期は売上高6,190万ドル(前年同期比45%増)と成長は続くものの、直近1か月では約15%下落した。共同創業者による約87万ドル相当の自社株売却が報じられたほか、複数のアナリストが目標株価を引き下げており、採算性への懸念が株価の重荷になっているとみられる。LivePerson買収を完了・統合を進めており、統合の進捗が今後の材料になる。`,
     `SoundHound AI is down roughly 20-30% year to date in 2026, and about 73% from its 52-week high of $22.17 (10/14/2025) to a recent level of $5.93 (9/21). Q2 revenue grew to $61.9M (+45% YoY), so growth continues, but the stock fell about 15% over the past month. Reports of a co-founder selling roughly $869K of stock, plus several analyst price-target cuts, appear to be weighing on shares amid profitability concerns. The company has completed its LivePerson acquisition and is integrating it, which will be a watch item going forward.`,
     `SoundHound AI는 2026년 들어 연초 대비 약 20~30% 하락했고, 52주 고점 $22.17(2025/10/14)에서 최근 저점권인 $5.93(9/21)까지 약 73% 떨어졌다. 2분기 매출은 6,190만 달러(전년 동기 대비 45% 증가)로 성장은 이어지고 있지만 최근 한 달간 약 15% 하락했다. 공동창업자가 약 86.9만 달러 상당의 자사주를 매도했다는 보도와 여러 애널리스트의 목표주가 하향이 겹쳐 수익성 우려가 주가에 부담이 되는 것으로 보인다. LivePerson 인수를 완료하고 통합을 진행 중이며 그 진행 상황이 향후 재료가 될 전망이다.`),
 src:[[`Robinhood`,`https://robinhood.com/us/en/stocks/SOUN/`],[`CNN`,`https://www.cnn.com/markets/stocks/SOUN`]]}
]};
const MACRO=[
{id:`x12`,important:true,date:`10/08`,imp:3,
 h:T(`WTI原油が+3.6%の91.49ドル、トランプ氏は中間選挙前のイラン攻撃を否定`,`WTI jumps 3.6% to $91.49; Trump says no Iran attack before midterms`,`WTI +3.6% 91.49달러, 트럼프 중간선거 전 이란 공격 부인`),
 s:T(`ホルムズ海峡でのタンカー攻撃増加と戦闘再開観測で上昇後、発言で上げ幅を縮小。`,`Rose on more tanker attacks near Hormuz and talk of renewed fighting, then pared gains after the remarks.`,`호르무즈 해협 유조선 공격 증가와 전투 재개 우려로 올랐다가 발언 후 상승폭 축소.`),
 d:T(`共同通信によると、10/8のNY原油先物(WTI11月渡し)は前日比3.21ドル高の91.49ドルで引けた。ホルムズ海峡でのタンカー攻撃の増加や、米国によるイランへの大規模な戦闘作戦再開の可能性が伝わり買いが膨らんだが、トランプ大統領がイランと建設的な協議が行われていると述べ、11月の中間選挙より前に攻撃しないとSNSで明らかにすると上げ幅が縮んだ。同日のNY為替ではドル円が158.37円まで上昇後に157.52円へ反落した。`,
     `Kyodo reported that WTI November futures closed on 10/8 up $3.21 at $91.49. Buying swelled on more tanker attacks near the Strait of Hormuz and the possibility of the US resuming large-scale operations against Iran, but gains narrowed after President Trump said on social media that talks with Iran were constructive and that he would not attack before the November midterms. In New York currency trading the same day, USD/JPY rose to 158.37 and then fell back to 157.52.`,
     `교도통신에 따르면 10/8 뉴욕 원유 선물(WTI 11월물)은 전일 대비 3.21달러 오른 91.49달러로 마감했다. 호르무즈 해협에서 유조선 공격이 늘고 미국이 이란에 대한 대규모 전투 작전을 재개할 가능성이 전해지며 매수가 늘었으나, 트럼프 대통령이 이란과 건설적 협의가 진행 중이며 11월 중간선거 전에는 공격하지 않겠다고 SNS에 밝히자 상승폭이 줄었다. 같은 날 뉴욕 외환시장에서 달러/엔은 158.37엔까지 올랐다가 157.52엔으로 되밀렸다.`),
 src:[[`共同通信(Yahoo!ニュース)`,`https://news.yahoo.co.jp/articles/83afc92a411b1de11003d89b42793727c0fcbc06`],[`日本経済新聞`,`https://www.nikkei.com/markets/commodities/`],[`財経新聞`,`https://www.zaikei.co.jp/article/20261009/872891.html`]]},
{id:`x13`,important:true,date:`10/07`,imp:3,
 h:T(`FOMC議事要旨、年末までの追加利上げを適切とする内容と報道 米10年債は5.2〜5.3%台`,`FOMC minutes reportedly back another hike by year-end; US 10Y at 5.2-5.3%`,`FOMC 의사요지, 연내 추가 인상 적절하다는 내용으로 보도, 미 10년물 5.2~5.3%대`),
 s:T(`10年債入札は最高落札利回り5.300%、応札倍率2.77倍。10/9朝の利回りは5.231%。`,`The 10-year auction cleared at 5.300% with a 2.77x bid-to-cover; the yield was 5.231% on the morning of 10/9.`,`10년물 입찰은 최고 낙찰 금리 5.300%, 응찰 배율 2.77배. 10/9 아침 금리는 5.231%.`),
 d:T(`時事通信は10/8朝の配信で、米FOMC議事要旨が年末までの追加利上げを適切とし、インフレの上振れを警戒していると伝えた。10/7の米10年債入札は最高落札利回りが5.300%(発行前利回り5.317%)、応札倍率は2.77倍と堅調で、2-10年債の利回り差は+51bpに拡大した。10/9朝の10年債利回りは5.231%(前日比-0.055%)。次回のFOMCは10/27〜28で、結果は日本時間10/29未明に公表され、ドットチャートは示されない。FRBは9月に政策金利を3.75〜4.00%へ引き上げている。`,
     `Jiji reported on the morning of 10/8 that the FOMC minutes judged another rate hike by year-end appropriate while warning about upside inflation risks. The 10/7 10-year Treasury auction cleared at a high yield of 5.300% (when-issued 5.317%) with a solid 2.77x bid-to-cover, and the 2s10s spread steepened to +51bp. The 10-year yield was 5.231% on the morning of 10/9 (-0.055 points). The next FOMC meets 10/27-28 with the decision due early 10/29 Tokyo time, and no dot plot. The Fed raised its target range to 3.75-4.00% in September.`,
     `시사통신은 10/8 아침 배신 기사에서 미 FOMC 의사요지가 연내 추가 금리 인상이 적절하다고 보며 인플레이션 상방 위험을 경계한다고 전했다. 10/7 미 10년물 입찰은 최고 낙찰 금리 5.300%(발행 전 금리 5.317%), 응찰 배율 2.77배로 견조했고 2-10년물 금리차는 +51bp로 확대됐다. 10/9 아침 10년물 금리는 5.231%(전일 대비 -0.055%포인트). 다음 FOMC는 10/27~28이며 결과는 일본 시간 10/29 새벽에 나오고 점도표는 공개되지 않는다. 연준은 9월 정책금리를 3.75~4.00%로 인상했다.`),
 src:[[`時事通信`,`https://equity.jiji.com/monetary_policy_schedules`],[`みんかぶ(NY債券)`,`https://fx.minkabu.jp/news/381050`],[`MacroWombat`,`https://macrowombat.com/calendar/fomc/2026-10`]]},
{id:`x14`,date:`10/06`,imp:2,
 h:T(`日銀、基調物価の2%到達を判断する可能性 10/29〜30の会合が焦点`,`BOJ may judge underlying inflation has reached 2%; the 10/29-30 meeting is the focus`,`일본은행, 기조 물가 2% 도달 판단 가능성, 10/29~30 회의가 초점`),
 s:T(`時事の見出しベース。植田総裁は10/6に基調物価が目標近辺で安定することが重要と発言。`,`Based on Jiji headlines; Governor Ueda said on 10/6 that stable underlying inflation near target matters more.`,`시사통신 헤드라인 기준. 우에다 총재는 10/6 기조 물가가 목표 부근에서 안정되는 것이 중요하다고 발언.`),
 d:T(`時事通信の見出しによると、日銀は基調物価の2%到達を今月の会合にも判断する方向で検討している(10/5)。植田総裁は10/6に、基調物価が目標の2%近辺にあり、安定がより重要だと述べた。9月会合では政策金利を1.25%に引き上げたと報じられている。次回会合は10/29〜30で、10/30に展望レポートが公表される予定。本文の詳細は未確認のため、見出しレベルの情報である。`,
     `According to Jiji headlines, the BOJ is considering judging as early as this month's meeting that underlying inflation has reached 2% (10/5). Governor Ueda said on 10/6 that underlying inflation is near the 2% target and that stability is now more important. The BOJ is reported to have raised its policy rate to 1.25% in September. The next meeting is 10/29-30, with the Outlook Report due 10/30. Only headlines were checked, not the full text.`,
     `시사통신 헤드라인에 따르면 일본은행은 기조 물가의 2% 도달을 이달 회의에서도 판단하는 방향으로 검토 중이다(10/5). 우에다 총재는 10/6 기조 물가가 목표 2% 부근이며 안정이 더 중요하다고 말했다. 9월 회의에서 정책금리를 1.25%로 인상했다고 보도됐다. 다음 회의는 10/29~30이며 10/30 경제·물가 전망 보고서가 공개될 예정이다. 본문은 확인하지 못했고 헤드라인 수준의 정보다.`),
 src:[[`時事通信`,`https://equity.jiji.com/monetary_policy_schedules`]]},
{id:`x1`,important:true,date:`09/16`,imp:3,
 h:T(`FRBが政策金利を3.75〜4.00%に引き上げ、2023年以来の利上げ`,`The Fed raises rates to 3.75-4.00%, its first hike since 2023`,`연준, 정책금리 3.75~4.00%로 인상, 2023년 이후 첫 인상`),
 s:T(`インフレ再加速への対応。市場は追加利上げの有無を注視。`,`A response to reaccelerating inflation; markets watch for further hikes.`,`인플레이션 재가속 대응. 시장은 추가 인상 여부를 주시.`),
 d:T(`FRBは9/16のFOMCで政策金利を3.75〜4.00%のレンジへ引き上げた。利下げ局面からの転換とされ、2023年以来の利上げとして報じられている。背景にはインフレ圧力の再燃があるとみられ、市場では今後の追加利上げの有無とペースに関心が集まっている。`,
     `At its 9/16 meeting the Fed raised its target range to 3.75-4.00%, marking its first hike since 2023 and a reversal from the prior easing stance. The move is attributed to renewed inflation pressure, with markets now focused on whether and how fast further hikes might follow.`,
     `연준은 9/16 FOMC에서 정책금리를 3.75~4.00% 범위로 인상했다. 완화 국면에서의 전환으로, 2023년 이후 첫 인상으로 보도된다. 배경에는 인플레이션 압력 재燃이 있는 것으로 보이며, 시장은 향후 추가 인상 여부와 속도에 관심을 두고 있다.`),
 src:[[`Federal Reserve`,`https://www.federalreserve.gov/monetarypolicy.htm`]]},
{id:`x2`,important:true,date:`09/18`,imp:3,
 h:T(`日銀が政策金利を1.25%に、31年ぶりの水準`,`BOJ lifts its policy rate to 1.25%, a 31-year high`,`일본은행, 정책금리 1.25%로, 31년 만의 수준`),
 s:T(`ドル円は157円台で推移、東京市場の休場中も介入警戒。`,`USD/JPY hovers near 157, with intervention risk flagged even during Tokyo's holiday.`,`달러/엔은 157엔대, 도쿄 휴장 중에도 개입 경계.`),
 d:T(`日銀は9/18、政策金利を1.25%へ引き上げた。この水準は約31年ぶりとされる。利上げ後もドル円は157円前後で推移しており、東京市場が9/21〜23の連休で休場となる中、当局による為替介入への警戒感が市場で意識されている。`,
     `The Bank of Japan raised its policy rate to 1.25% on 9/18, described as a 31-year high. USD/JPY has continued to trade near 157 even after the hike, and with Tokyo markets closed for holidays 9/21-23, traders are flagging intervention risk from Japanese authorities.`,
     `일본은행은 9/18 정책금리를 1.25%로 인상했다. 이는 약 31년 만의 수준으로 평가된다. 인상 후에도 달러/엔은 157엔 안팎에서 움직이고 있으며, 도쿄 시장이 9/21~23 연휴로 휴장인 가운데 당국의 외환 개입 경계감이 시장에서 의식되고 있다.`),
 src:[[`Bank of Japan`,`https://www.boj.or.jp/en/`]]},
{id:`x3`,important:true,date:`09/24`,imp:3,
 h:T(`トランプ・習近平の首脳会談がワシントンで9/24に予定`,`Trump-Xi summit set for Washington on 9/24`,`트럼프-시진핑 정상회담, 9/24 워싱턴에서 예정`),
 s:T(`関税休戦(11/10期限)、イラン戦争、AI対話が焦点。`,`Focus areas: the tariff truce (expires 11/10), the Iran war and an AI dialogue.`,`관세 휴전(11/10 만료), 이란 전쟁, AI 대화가 초점.`),
 d:T(`米中首脳会談が9/24にワシントンで開催予定と報じられている。主な議題として、11/10に期限を迎える関税休戦の扱い、イラン戦争を巡る立場、AI政策に関する対話が挙げられている。トランプ氏は会談に先立ち、AI政策を統括する「AI Force」の新設とAI担当官の任命方針を表明したと報じられた。`,
     `Reports say a Trump-Xi summit is scheduled for 9/24 in Washington, with the tariff truce expiring 11/10, positions on the Iran war, and an AI-policy dialogue cited as main agenda items. Ahead of the meeting, Trump reportedly announced plans to create an "AI Force" to oversee AI policy and to name an AI czar.`,
     `미중 정상회담이 9/24 워싱턴에서 열릴 예정이라고 보도되었다. 주요 의제로는 11/10에 만료되는 관세 휴전 처리, 이란 전쟁을 둘러싼 입장, AI 정책 대화가 꼽힌다. 트럼프 대통령은 회담에 앞서 AI 정책을 총괄할 'AI Force' 신설과 AI 담당관 임명 방침을 밝혔다고 보도되었다.`),
 src:[[`Reuters`,`https://www.reuters.com/world/`]]},
{id:`x4`,date:`09/19`,imp:2,
 h:T(`FT、ビッグテックのオフバランスAI債務を約3,000億ドルと報道`,`FT reports Big Tech's off-balance-sheet AI debt near $300 billion`,`FT, 빅테크의 장부 외 AI 부채 약 3,000억 달러로 보도`),
 s:T(`特別目的事業体(SPV)経由の調達が拡大しているとの指摘。`,`Says financing increasingly runs through special-purpose vehicles.`,`특수목적법인(SPV)을 통한 조달이 확대되고 있다는 지적.`),
 d:T(`Financial Timesは、主要テクノロジー企業がデータセンターやAIインフラ投資の資金を、貸借対照表に直接載らない特別目的事業体(SPV)を通じて調達する動きが広がっており、その規模が合計で約3,000億ドルに達すると報じた。急拡大するAI投資の資金構造の不透明さへの懸念材料として注目されている。`,
     `The Financial Times reported that major tech companies are increasingly financing data-center and AI infrastructure buildouts through off-balance-sheet special-purpose vehicles, with the combined total reaching roughly $300 billion. The report is drawing attention as a concern about opacity in the funding structure behind the AI capex boom.`,
     `Financial Times는 주요 테크 기업들이 데이터센터·AI 인프라 투자 자금을 대차대조표에 직접 반영되지 않는 특수목적법인(SPV)을 통해 조달하는 움직임이 확산되고 있으며 그 합계 규모가 약 3,000억 달러에 달한다고 보도했다. 급팽창하는 AI 투자의 자금 구조가 불투명하다는 우려 요인으로 주목받고 있다.`),
 src:[[`Financial Times`,`https://www.ft.com/`]]},
{id:`x5`,date:`09/17`,imp:2,
 h:T(`WTI原油が下落、供給見通しを巡る思惑`,`WTI crude falls on supply-outlook speculation`,`WTI 원유 하락, 공급 전망 관련 관측`),
 s:T(`$98台まで下落。中東情勢とOPEC+の増産観測が背景と報道。`,`Slid to the $98 range; reports cite Middle East tensions and OPEC+ supply speculation.`,`$98대까지 하락. 중동 정세와 OPEC+ 증산 관측이 배경으로 보도.`),
 d:T(`WTI原油先物は$98台前半まで下落した。中東情勢の展開やOPEC+の供給方針を巡る観測が材料視されているとみられるが、詳細な要因分析については続報を確認したい。`,
     `WTI crude futures fell to the low-$98 range. Middle East developments and speculation around OPEC+ supply policy appear to be factors, though a fuller breakdown awaits further reporting.`,
     `WTI 원유 선물은 $98대 초반까지 하락했다. 중동 정세 전개와 OPEC+ 공급 방침을 둘러싼 관측이 재료로 보이지만, 자세한 요인 분석은 후속 보도를 확인할 필요가 있다.`),
 src:[[`Investing.com`,`https://www.investing.com/commodities/crude-oil`]]},
{id:`x6`,date:`09/19`,imp:2,
 h:T(`ドルウォンが1,381ウォン近辺、ウォン安圧力が継続`,`USD/KRW near 1,381 as won stays under pressure`,`달러/원 1,381원대, 원화 약세 압력 지속`),
 s:T(`米金利上昇と地政学リスクが背景と見られる。`,`Higher US rates and geopolitical risk are seen as the backdrop.`,`미 금리 상승과 지정학 리스크가 배경으로 보임.`),
 d:T(`ドルウォンは1,381ウォン近辺で推移し、ウォン安基調が続いている。FRBの利上げによる米金利上昇や、中東・米中関係を巡る地政学リスクが背景として指摘されている。`,
     `USD/KRW has been trading near 1,381, with the won staying on a weakening trend. Higher US rates following the Fed hike and geopolitical risk around the Middle East and US-China relations are cited as contributing factors.`,
     `달러/원은 1,381원대에서 움직이며 원화 약세 흐름이 이어지고 있다. 연준의 금리 인상에 따른 미 금리 상승과 중동·미중 관계를 둘러싼 지정학 리스크가 배경으로 지목된다.`),
 src:[[`Investing.com`,`https://www.investing.com/currencies/usd-krw`]]},
{id:`x7`,date:`09/21`,imp:3,
 h:T(`NY株が過去最高値、原油と長期金利の低下が追い風`,`Wall Street hits record highs as oil and yields retreat`,`뉴욕 증시 사상 최고치, 유가·장기금리 하락이 순풍`),
 s:T(`ナスダックは+2.26%で最高値更新。WTIは4営業日続落で$95台。`,`Nasdaq rose 2.26% to a record; WTI fell for a 4th straight session to the mid-$90s.`,`나스닥은 +2.26%로 사상 최고치. WTI는 4거래일 연속 하락해 $95대.`),
 d:T(`9/21のNY株式市場はダウ+0.71%、S&P500+1.49%(7,764.70)、ナスダック+2.26%(27,122.09、最高値更新)。米・イラン間の緊張緩和への期待からWTI原油は4営業日続落し$95.59まで下落、米10年債利回りも4.96%まで低下した。原油安・金利低下がインフレ懸念を和らげ、AI関連株を中心に買いが広がった。半導体のAMDは時価総額1兆ドルを突破。`,
     `On 9/21, the Dow rose 0.71%, the S&P 500 gained 1.49% to 7,764.70, and the Nasdaq jumped 2.26% to a record 27,122.09. WTI crude fell for a fourth straight session to $95.59 on hopes of easing US-Iran tensions, while the US 10-year yield eased to 4.96%. Lower oil and yields calmed inflation worries and broadened buying into AI-related stocks; AMD's market cap crossed $1 trillion.`,
     `9/21 뉴욕 증시는 다우 +0.71%, S&P500 +1.49%(7,764.70), 나스닥 +2.26%(27,122.09, 사상 최고치)를 기록했다. 미-이란 긴장 완화 기대로 WTI 원유는 4거래일 연속 하락해 $95.59까지 내렸고, 미 10년물 금리도 4.96%로 낮아졌다. 유가·금리 하락이 인플레이션 우려를 완화하며 AI 관련주를 중심으로 매수세가 확산됐다. AMD는 시가총액 1조 달러를 돌파했다.`),
 src:[[`Trading Economics`,`https://tradingeconomics.com/united-states/stock-market`],[`Washington Post`,`https://www.washingtonpost.com/business/2026/09/21/wall-street-stocks-dow-nasdaq/`]]},
{id:`x8`,date:`09/28`,important:true,imp:3,
 h:T(`トランプ氏がイランの停戦案を拒否、原油反発・NY株は反落`,`Trump rejects Iran's ceasefire proposal; oil rebounds and US stocks fall`,`트럼프, 이란 휴전안 거부. 유가 반등·뉴욕 증시 하락`),
 s:T(`WTIは反発し$92台。トランプ氏は26日にイラン提案拒否と伝わる一方、条件次第で制裁緩和の用意もと報道。`,`WTI rebounded to the low-$90s. Trump reportedly rejected Iran's proposal on 9/26, though Axios says he may ease sanctions if Iran takes concrete nuclear steps.`,`WTI는 반등해 $92대. 트럼프는 9/26 이란 제안을 거부했다고 전해졌으나, Axios는 이란이 구체적 조치를 취하면 제재 완화 용의가 있다고 보도.`),
 d:T(`トランプ米大統領は9/26、イランの停戦案を拒否したと伝わり、中東情勢の先行き不透明感からWTI原油は反発し$92台まで上昇した。一方、Axiosは28日、関係者の話として、イランが核開発計画で具体的な措置を講じれば見返りに制裁緩和を用意しているとトランプ氏が伝えたと報じており、事態はなお流動的。原油高と米長期金利の上昇が重しとなり、28日のNYダウは347ドル安、ナスダックは3営業日ぶりに反落した。`,
     `President Trump reportedly rejected Iran's ceasefire proposal on 9/26, and WTI crude rebounded to the low-$90s amid renewed uncertainty over the Middle East. Separately, Axios reported on 9/28, citing sources, that Trump signaled he would ease sanctions on Iran in return for concrete steps on its nuclear program, suggesting the situation remains fluid. Higher oil prices and rising long-term US yields weighed on stocks, with the Dow falling 347 points and the Nasdaq snapping a 3-session winning streak on 9/28.`,
     `트럼프 미국 대통령이 9/26 이란의 휴전 제안을 거부했다고 전해지면서, 중동 정세 불확실성이 다시 부각되어 WTI 원유는 반등해 $92대까지 올랐다. 한편 Axios는 9/28 관계자를 인용해, 이란이 핵개발 계획에서 구체적 조치를 취하면 그 대가로 제재를 완화할 용의가 있다고 트럼프가 전했다고 보도해 상황은 여전히 유동적이다. 유가 상승과 미 장기 금리 상승이 부담이 되어 9/28 다우는 347포인트 하락, 나스닥은 3거래일 만에 반락했다.`),
 src:[[`日本経済新聞`,`https://nikkei.com/article/DGXZQOFL2900M0Z20C26A9000000`],[`Yahoo!ニュース`,`https://news.yahoo.co.jp/articles/94f3bdd0874df30755a001ec7624f040a66e34b2`]]},
{id:`x9`,date:`10/01`,important:true,imp:3,
 h:T(`日銀短観、大企業製造業DIは+24に改善も予想下回る。ドル円は157円台後半へ`,`BOJ Tankan: large-manufacturer DI improves to +24 but misses forecast; yen slips into the upper-157 range`,`일본은행 단칸, 대기업 제조업 DI +24로 개선되었으나 예상 하회. 달러/엔 157엔 후반대로`),
 s:T(`前回6月調査+22からは改善、市場予想+25は下回る。発表後に円売りが優勢。`,`Up from +22 in June but below the +25 forecast; the yen weakened after the release.`,`전회 6월 조사 +22에서 개선되었으나 시장 예상 +25에는 못 미침. 발표 후 엔화 매도 우세.`),
 d:T(`日銀が10/1朝に発表した9月の全国企業短期経済観測調査(短観)で、大企業製造業の業況判断指数(DI)は+24となり、6月調査の+22から改善したものの市場予想の+25には届かなかった。発表後の東京市場ではドル円が売られ(円安方向)、157円台後半まで上昇。半導体関連株などの上昇も相まって日経平均は一時2,000円超高となり、1月半ぶりに68,000円台を回復した。明日に発表される米雇用統計も相場の次の焦点として注目されている。`,
     `The Bank of Japan's September Tankan survey, released on the morning of 10/1, showed large manufacturers' sentiment index (DI) at +24, up from +22 in June but short of the +25 market forecast. USD/JPY weakened (yen softened) after the release, rising into the upper-157 range in Tokyo trade. Combined with gains in semiconductor-related shares, the Nikkei briefly rose more than 2,000 points, recovering above 68,000 for the first time in about six weeks. Thursday's US jobs report is the next focal point for markets.`,
     `일본은행이 10/1 아침 발표한 9월 전국기업단기경제관측조사(단칸)에서 대기업 제조업 업황판단지수(DI)는 +24로, 6월 조사의 +22에서 개선됐지만 시장 예상 +25에는 못 미쳤다. 발표 후 도쿄 시장에서는 달러/엔이 매도(엔화 약세 방향)되어 157엔 후반대까지 올랐다. 반도체 관련주 상승도 겹쳐 닛케이평균은 한때 2,000엔 넘게 올라 1개월 반 만에 6만8000엔대를 회복했다. 다음 날 발표되는 미국 고용지표가 다음 초점으로 주목받고 있다.`),
 src:[[`日本経済新聞`,`https://www.nikkei.com/article/DGXZQOFL044XF0U6A800C2000000/`],[`みんかぶ`,`https://fx.minkabu.jp/news/380423`]]},
{id:`x10`,date:`10/02`,imp:2,
 h:T(`米長期金利が一時5.34%まで上昇、2002年以来の高水準に`,`US 10-year yield briefly hits 5.34%, its highest since 2002`,`미 장기금리 일시 5.34%까지 상승, 2002년 이후 최고 수준`),
 s:T(`ISM製造業景況指数が予想を下回りインフレ懸念がくすぶる中、金利上昇は一服しS&P500は小幅高。`,`With the ISM manufacturing index missing forecasts and inflation worries simmering, the yield spike eased and the S&P 500 closed slightly higher.`,`ISM 제조업지수가 예상을 하회해 인플레이션 우려가 지속되는 가운데, 금리 상승은 진정되고 S&P500은 소폭 상승.`),
 d:T(`10/1の米国市場では長期金利(10年債利回り)が一時5.34%まで上昇し、2002年以来の高水準をつけた。その後は金利上昇が一服し、幅広い銘柄に買いが入りS&P500は前日比+0.19%の7,666.45で終えた。ISM製造業景況指数は市場予想を下回り、中東情勢の緊迫による原油高も重なってインフレ懸念はくすぶり続けている。セクター別ではエネルギー(+1.92%)や情報技術(+0.76%)が上昇した一方、ヘルスケア(-1.30%)は軟調。マイクロンの好決算を受け半導体関連株への物色も続いた。直近(10/6時点)の米10年債利回りは5.28%前後で推移している。`,
     `In US trading on 10/1, the 10-year Treasury yield briefly touched 5.34%, its highest level since 2002, before the rise eased and broad buying lifted the S&P 500 to a modest gain of +0.19% at 7,666.45. The ISM manufacturing index missed market forecasts, and oil prices stayed elevated on Middle East tensions, keeping inflation concerns simmering. By sector, energy (+1.92%) and information technology (+0.76%) led gains while healthcare (-1.30%) lagged. Chip-related names continued to draw interest following Micron's strong earnings. As of 10/6 the 10-year yield was trading around 5.28%.`,
     `10/1 미국 시장에서는 장기금리(10년물 국채수익률)가 한때 5.34%까지 상승해 2002년 이후 최고 수준을 기록했다. 이후 금리 상승은 진정되고 폭넓은 종목에 매수세가 유입되며 S&P500은 전일 대비 +0.19%인 7,666.45로 마감했다. ISM 제조업지수는 시장 예상을 하회했고, 중동 정세 긴장에 따른 유가 상승도 겹쳐 인플레이션 우려가 지속되고 있다. 섹터별로는 에너지(+1.92%), 정보기술(+0.76%)이 상승한 반면 헬스케어(-1.30%)는 약세였다. 마이크론의 호실적을 계기로 반도체 관련주에 대한 매수세도 이어졌다. 직근(10/6 기준) 미 10년물 금리는 5.28% 안팎에서 움직이고 있다.`),
 src:[[`OANDA証券`,`https://www.oanda.jp/lab-education/?p=129525`]]},
{id:`x11`,date:`10/05`,important:true,imp:3,
 h:T(`金価格が最高値圏を更新、通貨下落・インフレへの不安で質への逃避続く`,`Gold extends record highs as currency-debasement and inflation fears drive safe-haven demand`,`금 가격, 통화 가치 하락·인플레이션 불안으로 최고가 행진, 안전자산 수요 지속`),
 s:T(`財政赤字拡大や金融緩和観測を背景に、金は主要国の通貨・インフレへの二重のリスクへの反応として買われ続けている。`,`Against a backdrop of widening fiscal deficits and expectations for easier monetary policy, gold keeps attracting buying as a direct response to the twin risks of currency debasement and inflation.`,`재정적자 확대와 금융완화 기대를 배경으로, 금은 주요국 통화·인플레이션이라는 이중 리스크에 대한 반응으로 계속 매수되고 있다.`),
 d:T(`金(ゴールド)は年初来で大幅高となっており、直近(10/6時点)の価格は1トロイオンス4,151.77ドル前後で推移している。エコノミストからは、今回の上昇局面は米国をはじめとする主要国のインフレと通貨切り下げという二重のリスクへの直接的な反応だとの指摘が出ている。世界金融危機以降に積み上がった各国政府の巨額債務や、米長期金利の高止まり(直近5.28%前後)、地政学リスクの高まりが、安全資産としての金需要を押し上げている背景とされる。`,
     `Gold has rallied sharply year-to-date, trading around $4,151.77 per troy ounce as of 10/6. Economists describe the move as a direct response to the twin risks of inflation and currency debasement across major economies, including the US. Massive government debt accumulated since the global financial crisis, persistently high US long-term yields (currently around 5.28%), and rising geopolitical risk are cited as the backdrop lifting demand for gold as a safe-haven asset.`,
     `금(골드)은 연초 대비 큰 폭으로 올라, 직근(10/6 기준) 가격은 트로이온스당 4,151.77달러 안팎에서 거래되고 있다. 이코노미스트들은 이번 상승이 미국을 비롯한 주요국의 인플레이션과 통화 가치 하락이라는 이중 리스크에 대한 직접적인 반응이라고 지적한다. 글로벌 금융위기 이후 쌓인 각국 정부의 막대한 부채, 높은 수준을 유지하는 미 장기금리(현재 5.28% 안팎), 지정학적 리스크 고조가 안전자산으로서의 금 수요를 끌어올리는 배경으로 꼽힌다.`),
 src:[[`Business Insider Japan`,`https://www.businessinsider.jp/article/2510-gold-price-today-record-high-4000-debt-inflation-economy/`]]}
];

const BREACH=[
{id:`b1`,type:`breach`,tag:`advisory`,important:true,date:`10/09`,
 h:T(`JPCERT/CC、相次ぐ国内の不正アクセスで注意喚起(10/9更新)`,`JPCERT/CC warns of the wave of intrusions at Japanese organizations (updated 10/9)`,`JPCERT/CC, 일본 내 잇따른 부정 접속에 주의보(10/9 갱신)`),
 s:T(`既知脆弱性の探索、APIへの不正リクエスト、Metabase脆弱性(CVE-2026-72898)の悪用などを確認。BIや管理画面も標的。`,`Reports scanning for known flaws, API abuse and exploitation of a Metabase flaw (CVE-2026-72898); BI tools and admin systems are targets too.`,`알려진 취약점 탐색, API 부정 요청, Metabase 취약점(CVE-2026-72898) 악용 등 확인. BI·관리 시스템도 표적.`),
 d:T(`【概要】JPCERT/CCが10/8に注意喚起(JPCERT-AT-2026-0030)を公表し、10/9に更新。9月前後に国内組織で個人情報の漏えいが相次いでいるとして、特に増えている恐れのある攻撃類型を整理した。全事案が同じ手口・攻撃者によるとは断定していない。
【確認されている手口】標的ごとに既知の脆弱性や設定不備を探索/アプリの管理用APIへの不正リクエスト(公開アプリを解析してAPIキーを特定、権限変更、不正アカウント作成など)/MetabaseのSQLインジェクション脆弱性の悪用/公開サーバーから到達できるアプリサーバーへのWebシェル設置(10/9追加)。
【推奨される対策】APIのレート制限とアクセス制御、トークンの最小権限と有効期限、脆弱性の修正適用、BIや管理機能など外部公開を前提としない環境の点検、不要データの削除。`,
     `[Overview] JPCERT/CC issued advisory JPCERT-AT-2026-0030 on 10/8 and updated it on 10/9, saying personal-data leaks at Japanese organizations have been piling up since around September, and laying out the attack types that may be increasing. It does not say every case used the same method or attacker.
[Methods seen] Scanning each target for known flaws and misconfigurations; malicious requests to app admin APIs (finding API keys by analyzing public apps, changing privileges, creating rogue accounts); exploitation of the Metabase SQL injection flaw; web shells on application servers reachable from public web servers (added 10/9).
[Recommended steps] Rate limits and access control on APIs, least-privilege and expiring tokens, applying patches, reviewing BI and admin systems not meant for public access, and deleting unneeded data.`,
     `[개요] JPCERT/CC는 10/8 주의보(JPCERT-AT-2026-0030)를 공표하고 10/9 갱신했다. 9월 전후로 국내 조직에서 개인정보 유출이 잇따르고 있다며 특히 늘어날 우려가 있는 공격 유형을 정리했다. 모든 사건이 같은 수법·공격자라고 단정하지는 않았다.
[확인된 수법] 표적별로 알려진 취약점·설정 불비 탐색/앱 관리용 API에 대한 부정 요청(공개 앱을 분석해 API 키 특정, 권한 변경, 부정 계정 생성 등)/Metabase SQL 인젝션 취약점 악용/공개 서버에서 접근 가능한 애플리케이션 서버에 웹셸 설치(10/9 추가).
[권장 대책] API 요청 제한과 접근 제어, 토큰 최소 권한·유효기간, 취약점 패치, BI·관리 기능 등 비공개 전제 환경 점검, 불필요한 데이터 삭제.`),
 src:[[`JPCERT/CC 注意喚起`,`https://www.jpcert.or.jp/at/2026/at260030.html`],[`セキュリティ対策Lab(IPAの要請)`,`https://rocket-boys.co.jp/security-measures-lab/ipa_urgent_security_checklist_multigov_guidance_20261009/`]]},
{id:`b2`,type:`breach`,tag:`leak`,important:true,date:`10/09`,
 h:T(`ブックオフG:会員情報が外部取得、最大約643万件の会員番号が対象`,`Bookoff Group: member data taken, up to about 6.43M member numbers affected`,`북오프 그룹: 회원 정보 외부 취득, 최대 약 643만 건의 회원번호 대상`),
 s:T(`子会社の会員管理システムに不正アクセス。10/6に把握。パスワードはハッシュ値。決済情報は保有なし。`,`Subsidiary's member system breached; found 10/6. Passwords are hashed; no payment data held there.`,`자회사 회원 관리 시스템에 부정 접속. 10/6 인지. 비밀번호는 해시값, 결제 정보는 미보유.`),
 d:T(`【発覚・公表】10/6に子会社の会員管理システムへの不正アクセスを把握し、10/9に公表。攻撃元の通信を遮断し、脆弱性を是正した。
【被害】最大約643万件の会員番号に関する情報。氏名、生年月日、性別、メールアドレス、電話番号、住所、パスワードのハッシュ値、ポイントカード番号などが対象になり得る。約643万件は件数で、643万人の流出が確定したわけではない。クレジットカード等の決済情報は当該システムで保有していない。`,
     `[Discovery and disclosure] Found on 10/6 and announced on 10/9. The attacker's traffic was blocked and the flaw fixed.
[Damage] Information tied to up to about 6.43 million member numbers, possibly including name, birth date, gender, email, phone, address, password hashes and point-card numbers. The figure is a record count, not a confirmed 6.43 million people. No credit-card or other payment data was held in that system.`,
     `[발각·공표] 10/6 자회사 회원 관리 시스템에 대한 부정 접속을 파악해 10/9 공표. 공격 측 통신을 차단하고 취약점을 시정했다.
[피해] 최대 약 643만 건의 회원번호 관련 정보. 이름, 생년월일, 성별, 이메일, 전화번호, 주소, 비밀번호 해시값, 포인트카드 번호 등이 대상일 수 있다. 약 643만은 건수이며 643만 명의 유출이 확정된 것은 아니다. 신용카드 등 결제 정보는 해당 시스템에 없다.`),
 src:[[`ブックオフ公式発表(PDF)`,`https://ssl4.eir-parts.net/doc/9278/tdnet/2893077/00.pdf`],[`セキュリティ対策Lab`,`https://rocket-boys.co.jp/security-measures-lab/bookoff_customer_data_breach_20261009/`]]},
{id:`b3`,type:`breach`,tag:`leak`,important:true,date:`10/08`,
 h:T(`skyticket:氏名・住所・ハッシュ化パスワード・銀行口座情報などが流出`,`skyticket: names, addresses, hashed passwords and bank account details leaked`,`skyticket: 이름·주소·해시 비밀번호·은행 계좌 정보 등 유출`),
 s:T(`クレジットカード情報は流出していないと説明。人数は公式表記の確認が必要。`,`The company says no credit-card data leaked. Check the official figure for the number affected.`,`신용카드 정보는 유출되지 않았다고 설명. 대상 인원은 공식 표기 확인 필요.`),
 d:T(`【公表】旅行予約サービス「skyticket」を運営するアドベンチャーが10/8に不正アクセスによる会員情報の流出を公表。10/9には、流出に関する通知メールが正規のものだと案内した。
【被害】氏名、住所、電話番号、ハッシュ化されたログインパスワード、銀行口座情報などが影響項目。クレジットカード情報は流出していないとしている。
【件数】一部のまとめ記事は約1,464万件(うち約413万件はハッシュ化パスワードも対象)と記載しているが、公式での人数の明示は確認できていない。他サービスと同じパスワードを使っている場合は変更が望ましい。`,
     `[Disclosure] Adventure, which runs the travel booking service skyticket, announced on 10/8 that member data leaked after unauthorized access, and on 10/9 confirmed that its notification emails are genuine.
[Damage] Names, addresses, phone numbers, hashed login passwords and bank account details are listed. The company says credit-card data did not leak.
[Count] Some roundups cite about 14.64 million records (about 4.13 million with hashed passwords), but we could not confirm an official figure for people affected. Change any password reused on other services.`,
     `[공표] 여행 예약 서비스 skyticket 운영사 어드벤처가 10/8 부정 접속에 따른 회원 정보 유출을 공표했고 10/9에는 유출 관련 안내 메일이 정식 메일임을 재차 알렸다.
[피해] 이름, 주소, 전화번호, 해시된 로그인 비밀번호, 은행 계좌 정보 등이 영향 항목. 신용카드 정보는 유출되지 않았다고 한다.
[건수] 일부 정리 기사는 약 1,464만 건(그중 약 413만 건은 해시 비밀번호 포함)이라고 쓰지만 공식 인원 표기는 확인하지 못했다. 다른 서비스와 같은 비밀번호를 쓴다면 변경이 바람직하다.`),
 src:[[`skyticket公式`,`https://skyticket.jp/news/maintenance/67592`],[`まとめ記事(件数の出典)`,`https://www.horimemo.online/news-sns/data-leak-september-2026/`]]},
{id:`b4`,type:`breach`,tag:`leak`,important:true,date:`10/08`,
 h:T(`ローソンID:215万5,345件の個人情報が漏えい`,`Lawson ID: 2,155,345 personal records leaked`,`로손 ID: 개인정보 215만 5,345건 유출`),
 s:T(`ID情報を表示する仕組みが不正に利用された。アプリ予約26件ではカード番号の一部も対象。`,`A mechanism that displays ID data was abused; 26 app reservations also exposed part of a card number.`,`ID 정보를 표시하는 구조가 악용됨. 앱 예약 26건은 카드번호 일부도 대상.`),
 d:T(`【公表】ローソンは10/8、ローソンIDの個人情報2,155,345件と、ローソンアプリ予約の26件の漏えいを公表した。
【被害】対象項目は登録状況により異なり、アプリ予約分にはカード番号の一部が含まれる。カード番号の全体が流出したとは公表されていない。利用者への情報表示に関係する仕組みが不正に利用されたと説明している。不審なメールやSMSには注意が必要。`,
     `[Disclosure] On 10/8 Lawson announced the leak of 2,155,345 personal records tied to Lawson ID and 26 Lawson app reservations.
[Damage] Items vary by registration status, and the app reservation records include part of a card number. A full card number leak has not been announced. Lawson says a mechanism for displaying information to users was abused. Beware of suspicious emails and SMS.`,
     `[공표] 로손은 10/8 로손 ID 개인정보 2,155,345건과 로손 앱 예약 26건의 유출을 공표했다.
[피해] 대상 항목은 등록 상황에 따라 다르며 앱 예약분에는 카드번호 일부가 포함된다. 카드번호 전체가 유출됐다는 발표는 없다. 이용자에게 정보를 표시하는 구조가 부정 이용됐다고 설명했다. 수상한 메일·SMS에 주의해야 한다.`),
 src:[[`ローソン公式`,`https://www.lawson.co.jp/contents/cont07/1533174_3310.html`]]},
{id:`b5`,type:`breach`,tag:`supply`,important:true,date:`10/08`,
 h:T(`第一興商:委託先PC1台の感染で約872万4,000件に漏えいのおそれ`,`Daiichikosho: one vendor PC infected, up to about 8.72M records at risk`,`다이이치코쇼: 위탁처 PC 1대 감염, 약 872만 4,000건 유출 우려`),
 s:T(`外部への流出は10/8時点で未確認。ビッグエコー等の会員登録・予約時の情報が対象。`,`No external leak confirmed as of 10/8. Covers data from Big Echo membership and reservations.`,`10/8 시점 외부 유출 미확인. 빅에코 등 회원 등록·예약 시 정보가 대상.`),
 d:T(`【概要】個人情報の取扱いを委託している日本コロムビアグループの従業員PC1台でマルウェア感染が判明し、10/8に公表した。
【対象】顧客約863万1,000件と従業員約9万3,000件の計約872万4,000件。店舗での会員登録・予約時の氏名、性別、生年月日、メールアドレス、電話番号。
【状況】外部への情報流出は10/8時点で確認されていない。委託業務のため端末に一時保存したデータが影響を広げた事案。`,
     `[Overview] Malware was found on one employee PC at Nippon Columbia Group, which handles personal data under contract, and Daiichikosho announced it on 10/8.
[Scope] About 8.631 million customer records and 93,000 employee records, about 8.724 million in total: names, gender, birth dates, emails and phone numbers from in-store membership and reservations.
[Status] No external leak was confirmed as of 10/8. Data temporarily stored on the device for contract work widened the exposure.`,
     `[개요] 개인정보 취급을 위탁한 일본 콜롬비아 그룹 직원 PC 1대에서 악성코드 감염이 확인되어 10/8 공표했다.
[대상] 고객 약 863만 1,000건과 직원 약 9만 3,000건, 합계 약 872만 4,000건. 매장 회원 등록·예약 시의 이름, 성별, 생년월일, 이메일, 전화번호.
[상황] 외부 유출은 10/8 시점 확인되지 않았다. 위탁 업무를 위해 단말에 임시 저장한 데이터가 영향을 넓힌 사건.`),
 src:[[`第一興商公式`,`https://www.dkkaraoke.co.jp/news/newsletter/261008_2.html`]]},
{id:`b6`,type:`breach`,tag:`leak`,date:`10/08`,
 h:T(`NewsPicks(ユーザベース):業務用管理ツールに不正アクセス`,`NewsPicks (Uzabase): admin tool breached`,`NewsPicks(유저베이스): 업무용 관리 도구에 부정 접속`),
 s:T(`氏名・勤務先・連絡先・カード番号の下3〜4桁などが漏えいのおそれ。人数は調査中。`,`Names, employers, contacts and the last 3-4 card digits may have leaked; the number affected is under review.`,`이름·근무처·연락처·카드번호 끝 3~4자리 등 유출 우려. 인원은 조사 중.`),
 d:T(`【経緯】10/8 12:48に検知し、14:01に対象サーバーを遮断した。
【対象】氏名、勤務先、メールアドレス、住所、電話番号、カード名義、カード番号の下3桁または下4桁など。完全なカード番号や暗号化パスワードの漏えいは確認されていない。対象人数は調査中。`,
     `[Timeline] Detected at 12:48 on 10/8; the affected server was cut off at 14:01.
[Scope] Names, employers, emails, addresses, phone numbers, cardholder names and the last 3 or 4 card digits. Full card numbers and encrypted passwords were not confirmed leaked. The number affected is under review.`,
     `[경과] 10/8 12:48 탐지, 14:01 해당 서버 차단.
[대상] 이름, 근무처, 이메일, 주소, 전화번호, 카드 명의, 카드번호 끝 3자리 또는 4자리 등. 전체 카드번호와 암호화된 비밀번호 유출은 확인되지 않았다. 대상 인원은 조사 중.`),
 src:[[`NewsPicks公式`,`https://corp.newspicks.com/info/20261008`]]},
{id:`b7`,type:`breach`,tag:`supply`,date:`10/08`,
 h:T(`Commune:管理者なりすましが利用企業に波及、サービス停止も`,`Commune: admin impersonation spreads to client companies, services paused`,`Commune: 관리자 사칭이 이용 기업으로 파급, 서비스 중단도`),
 s:T(`VALXは2,950名、nest Portalは約1,200名に漏えいの可能性。`,`Possible leaks: 2,950 people at VALX and about 1,200 at nest Portal.`,`VALX 2,950명, nest Portal 약 1,200명에 유출 가능성.`),
 d:T(`【発生】10/6に第三者の不正アクセスが発生。システム上の複数の不備を悪用して管理者になりすましたとVALXが公表した。
【被害】VALX“FUN”コミュニティの会員3,813名のうち2,950名分の一覧情報が閲覧・取得された可能性。ウイングアーク1stのnest Portalでも、企業名・役職・氏名・メールアドレスなど約1,200名分に漏えいの可能性。
【影響】10/6 21時からコミュニティサイトとアプリを臨時停止し、準備の整ったコミュニティから順次再開。停止対象と漏えい可能性が確認された組織は一致しない。`,
     `[Occurrence] Unauthorized access began on 10/6; VALX says attackers exploited several system flaws to impersonate an administrator.
[Damage] Member list data for 2,950 of 3,813 members of the VALX "FUN" community may have been viewed or taken. Wingarc1st's nest Portal also reported possible leaks for about 1,200 people (company, title, name, email).
[Impact] Community sites and apps were paused from 21:00 on 10/6 and are being restored community by community. Paused communities and those with confirmed possible leaks do not fully overlap.`,
     `[발생] 10/6 제3자의 부정 접속이 발생. 시스템상 여러 결함을 악용해 관리자로 사칭했다고 VALX가 공표했다.
[피해] VALX 'FUN' 커뮤니티 회원 3,813명 중 2,950명분 목록 정보가 열람·취득됐을 가능성. 윙아크1st의 nest Portal에서도 회사명·직책·이름·이메일 등 약 1,200명분에 유출 가능성.
[영향] 10/6 21시부터 커뮤니티 사이트와 앱을 임시 중단하고 준비된 커뮤니티부터 순차 재개. 중단 대상과 유출 가능성이 확인된 조직은 일치하지 않는다.`),
 src:[[`VALX公式`,`https://corp.valx.jp/news/451vhhqdf29c/`],[`ウイングアーク1st公式`,`https://corp.wingarc.com/public/202610/news3042.html`]]},
{id:`b8`,type:`breach`,tag:`outage`,important:true,date:`10/07`,
 h:T(`IDCFクラウド(IDCフロンティア):ランサムウェアで東日本リージョン1が停止、495の企業・自治体に影響`,`IDCF Cloud (IDC Frontier): ransomware halts East Japan Region 1, affecting 495 companies and municipalities`,`IDCF 클라우드(IDC 프런티어): 랜섬웨어로 동일본 리전1 중단, 495개 기업·지자체 영향`),
 s:T(`495は契約先の数で、漏えい件数ではない。外部流出は未確定。`,`495 is the number of customers, not leaked records. External leakage is unconfirmed.`,`495는 계약처 수이며 유출 건수가 아니다. 외부 유출은 미확정.`),
 d:T(`【発生】10/7 3:40ごろから障害が発生し、第三者によるランサムウェア攻撃が原因だとIDCフロンティアが公表した。
【影響】クラウド側の隔離・停止により、契約先のWebサイト、業務システム、認証、電話関連サービスなどに波及。契約先は495の企業・自治体。バックアップから別のクラウドへ再構築する事業者もある。報道ではデータの復元が困難とされ、外部流出は未確定。495は情報流出が確定した数ではない。`,
     `[Occurrence] A failure began around 3:40 on 10/7, and IDC Frontier said a third-party ransomware attack was the cause.
[Impact] Isolating and halting the cloud disrupted customers' websites, business systems, authentication and phone services. 495 companies and municipalities are customers. Some are rebuilding on other clouds from backups. Reports say data recovery is difficult, and external leakage is unconfirmed. 495 is not a count of confirmed leaks.`,
     `[발생] 10/7 3시 40분경부터 장애가 발생했고 제3자의 랜섬웨어 공격이 원인이라고 IDC 프런티어가 공표했다.
[영향] 클라우드 측 격리·중단으로 계약처의 웹사이트, 업무 시스템, 인증, 전화 관련 서비스 등에 파급. 계약처는 495개 기업·지자체. 백업으로 다른 클라우드에 재구축하는 사업자도 있다. 보도에서는 데이터 복구가 어렵다고 하며 외부 유출은 미확정. 495는 정보 유출이 확정된 수가 아니다.`),
 src:[[`IDCフロンティア公式`,`https://www.idcf.jp/news/topics/20261007002`]]},
{id:`b9`,type:`breach`,tag:`supply`,date:`10/06`,
 h:T(`スカラ「i-ask」:FAQシステムに不正ログイン、最大5社・延べ71万3,126件`,`Scala "i-ask": FAQ system breached, up to 5 companies and 713,126 records`,`스칼라 'i-ask': FAQ 시스템 부정 로그인, 최대 5개사·연 71만 3,126건`),
 s:T(`大和証券は約11万人・約22万件の顧客情報漏えいの可能性を公表(10/5)。`,`Daiwa Securities disclosed possible leaks of about 110,000 customers and 220,000 records (10/5).`,`다이와증권은 약 11만 명·약 22만 건의 고객 정보 유출 가능성을 공표(10/5).`),
 d:T(`【概要】スカラコミュニケーションズは10/6、FAQシステム「i-ask」の管理サイトに不正ログインされ、不正プログラムが設置されたと発表した。
【被害】最大5社・延べ713,126件の問い合わせ情報に漏えいの可能性。大和証券、シチズン時計、損保ジャパンなど利用企業も影響を公表している。氏名や問い合わせ本文のほか、委託元によっては口座番号なども対象。延べ件数は人数ではない。`,
     `[Overview] On 10/6 Scala Communications said the admin site of its FAQ system "i-ask" was accessed with stolen credentials and a malicious program was planted.
[Damage] Inquiry data of up to 5 companies, 713,126 records in total, may have leaked. Client companies including Daiwa Securities, Citizen Watch and Sompo Japan have disclosed impact. Names and inquiry text, and for some clients account numbers, are included. The total is a record count, not people.`,
     `[개요] 스칼라 커뮤니케이션즈는 10/6 FAQ 시스템 'i-ask' 관리 사이트에 부정 로그인이 있었고 악성 프로그램이 설치됐다고 발표했다.
[피해] 최대 5개사·연 713,126건의 문의 정보에 유출 가능성. 다이와증권, 시티즌 시계, 손보재팬 등 이용 기업도 영향을 공표했다. 이름과 문의 본문 외에 위탁 측에 따라 계좌번호 등도 대상. 연 건수는 인원이 아니다.`),
 src:[[`スカラコミュニケーションズ公式`,`https://scala-com.jp/news/2026/10-1/`]]},
{id:`b10`,type:`breach`,tag:`leak`,important:true,date:`10/05`,
 h:T(`焼肉きんぐ公式アプリ:会員情報1,078万8,963件が漏えい`,`Yakiniku King app: 10,788,963 member records leaked`,`야키니쿠 킹 공식 앱: 회원 정보 1,078만 8,963건 유출`),
 s:T(`会員番号・登録名・メール・電話番号。パスワード、利用履歴、カード情報は対象外。`,`Member number, name, email and phone. Passwords, usage history and card data are not affected.`,`회원번호·등록명·이메일·전화번호. 비밀번호·이용 내역·카드 정보는 대상 외.`),
 d:T(`【経緯】物語コーポレーションは10/5、公式アプリの会員管理システムから登録情報1,078万8,963件が漏えいしたと発表。10/2に不正アクセスを確認し、10/3に漏えいを確認した。
【対象】会員番号、登録名、メールアドレス、電話番号。パスワード、店舗利用履歴、クレジットカード情報は対象外としている。連絡先が大量に取得されたため、フィッシングへの警戒が必要。`,
     `[Timeline] Monogatari Corporation announced on 10/5 that 10,788,963 registration records leaked from the app's member management system. It confirmed unauthorized access on 10/2 and the leak on 10/3.
[Scope] Member number, registered name, email and phone number. Passwords, store usage history and credit-card data are said to be unaffected. Because contact details were taken in bulk, watch for phishing.`,
     `[경과] 모노가타리 코퍼레이션은 10/5 공식 앱 회원 관리 시스템에서 등록 정보 1,078만 8,963건이 유출됐다고 발표. 10/2 부정 접속을, 10/3 유출을 확인했다.
[대상] 회원번호, 등록명, 이메일, 전화번호. 비밀번호, 매장 이용 내역, 신용카드 정보는 대상 외라고 한다. 연락처가 대량 취득돼 피싱에 주의해야 한다.`),
 src:[[`物語コーポレーション公式`,`https://www.monogatari.co.jp/news/261005_news/`]]},
{id:`b11`,type:`breach`,tag:`leak`,date:`10/05`,
 h:T(`infoQ(GMOリサーチ&AI):最大94万8,498件、ポイント約287万円分が不正交換`,`infoQ (GMO Research & AI): up to 948,498 records, about 2.87M yen of points fraudulently redeemed`,`infoQ(GMO리서치&AI): 최대 94만 8,498건, 약 287만 엔 상당 포인트 부정 교환`),
 s:T(`611件がAmazonギフトコードに交換された。会社は全額補填するとしている。`,`611 accounts had points swapped for Amazon gift codes; the company says it will cover the full amount.`,`611건이 아마존 기프트 코드로 교환됨. 회사는 전액 보전한다고 밝힘.`),
 d:T(`【概要】GMOリサーチ&AIは10/5、アンケートサイト「infoQ」のデータが外部へ持ち出されたと公表。使用ソフトウェアの脆弱性が悪用された。
【被害】最大94万8,498件は対象情報の上限。氏名、住所、メールアドレス、暗号化されたパスワード、ポイント情報などが含まれる。611件・286万9,500円分のポイントが、利用者の意思に反してAmazonギフトコードへ交換された。`,
     `[Overview] GMO Research & AI announced on 10/5 that data from its survey site infoQ was taken; a flaw in software it used was exploited.
[Damage] Up to 948,498 records is the upper limit of affected data, including names, addresses, emails, encrypted passwords and point balances. Points worth 2,869,500 yen across 611 cases were swapped for Amazon gift codes against users' wishes.`,
     `[개요] GMO리서치&AI는 10/5 설문 사이트 infoQ의 데이터가 외부로 반출됐다고 공표. 사용 소프트웨어의 취약점이 악용됐다.
[피해] 최대 94만 8,498건은 대상 정보의 상한. 이름, 주소, 이메일, 암호화된 비밀번호, 포인트 정보 등이 포함된다. 611건·286만 9,500엔 상당의 포인트가 이용자 의사에 반해 아마존 기프트 코드로 교환됐다.`),
 src:[[`GMOリサーチ&AI公式`,`https://gmo-research.ai/pressroom/notice/notice-20261005`]]},
{id:`b12`,type:`breach`,tag:`leak`,important:true,date:`09/29`,
 h:T(`タイムズカー:約660万アカウントを取得、約160万で本人確認書類の画像`,`Times Car: about 6.6M accounts taken, ID document images for about 1.6M`,`타임스카: 약 660만 계정 취득, 약 160만 계정에서 본인 확인 서류 이미지`),
 s:T(`運転免許証などの画像が流出。退会済み会員や入会手続き未完了者も含まれる。`,`Driver's license images and similar leaked; former members and incomplete sign-ups are included.`,`운전면허증 등 이미지 유출. 탈퇴 회원과 가입 미완료자도 포함.`),
 d:T(`【経緯】9/25にWebシステムへの不正アクセスを検知し、約660万アカウント分の情報が第三者に取得された。9/29の第3報で、約160万アカウントで運転免許証など本人確認書類の画像の漏えいを確認したと公表した。
【影響】退会済みの会員や入会手続き未完了の人も含まれる。報道では、免許証の特例再交付が少なくとも14県で行われたとされる。`,
     `[Timeline] Unauthorized access to the web system was detected on 9/25, and data for about 6.6 million accounts was taken by a third party. The third report on 9/29 confirmed leaks of ID document images such as driver's licenses for about 1.6 million accounts.
[Impact] Former members and people who did not finish signing up are included. Reports say special reissuance of driver's licenses took place in at least 14 prefectures.`,
     `[경과] 9/25 웹 시스템에 대한 부정 접속을 탐지했고 약 660만 계정분 정보가 제3자에게 취득됐다. 9/29 제3보에서 약 160만 계정에서 운전면허증 등 본인 확인 서류 이미지 유출을 확인했다고 공표.
[영향] 탈퇴 회원과 가입 절차 미완료자도 포함된다. 보도에 따르면 면허증 특례 재발급이 적어도 14개 현에서 이뤄졌다.`),
 src:[[`パーク24公式`,`https://www.park24.co.jp/news/2026/09/20260929-1.html`]]},
{id:`b13`,type:`breach`,tag:`leak`,date:`10/08`,
 h:T(`アドバンテスト(米国法人):2月のランサムウェア攻撃で個人情報が持ち出されたと通知`,`Advantest (US unit): notice says personal data was taken in the February ransomware attack`,`어드반테스트(미국 법인): 2월 랜섬웨어 공격에서 개인정보 반출 통지`),
 s:T(`米当局への届出で、サーバーから一部データが抽出され個人識別情報が含まれると確認。`,`A US filing confirms some data was extracted from servers and includes personally identifiable information.`,`미국 당국 신고에서 서버에서 일부 데이터가 추출됐고 개인 식별 정보가 포함됐음을 확인.`),
 d:T(`【経緯】2/15にIT環境の異常を検知し、2/19に不正アクセスとランサムウェア展開の可能性を公表。3/4の続報時点ではデータの流出範囲を調査中だった。10月の対象者向け通知で、第三者がサーバーから一部データを持ち出したことが明らかになった。
【対象情報】通知には、連絡先、生年月日、米国の社会保障番号、国民ID、運転免許証、パスポート番号、医療情報、金融情報などが挙げられている。全員が全項目に該当するとは限らない。`,
     `[Timeline] Abnormal activity in the IT environment was detected on 2/15, and on 2/19 the company disclosed possible unauthorized access and ransomware deployment. As of the 3/4 update the scope of data exfiltration was under investigation. Notices to affected people in October revealed that a third party took some data from servers.
[Information listed] Contact details, birth date, US Social Security number, national ID, driver's license, passport number, medical and financial information. Not every person is necessarily affected in every category.`,
     `[경과] 2/15 IT 환경 이상을 탐지하고 2/19 부정 접속과 랜섬웨어 전개 가능성을 공표. 3/4 속보 시점에는 데이터 유출 범위를 조사 중이었다. 10월 대상자 통지에서 제3자가 서버에서 일부 데이터를 반출했음이 드러났다.
[기재된 정보] 연락처, 생년월일, 미국 사회보장번호, 국민 ID, 운전면허증, 여권번호, 의료 정보, 금융 정보 등. 모든 대상자가 모든 항목에 해당하는 것은 아니다.`),
 country:`US`,
 src:[[`セキュリティ対策Lab`,`https://rocket-boys.co.jp/security-measures-lab/advantest-ransomware-data-breach-2026/`]]},
{id:`b14`,type:`breach`,tag:`overseas`,date:`10/05`,
 h:T(`デンマーク:正規の照会権限を悪用され、約880万人の住民登録情報に不正アクセス`,`Denmark: legitimate lookup access abused, about 8.8M people's registry data accessed`,`덴마크: 정규 조회 권한 악용, 약 880만 명의 주민등록 정보에 부정 접근`),
 s:T(`中央個人登録(CPR)。氏名・住所・CPR番号など。データベースへの直接侵入ではない。`,`Central Person Register (CPR): names, addresses and CPR numbers. Not a direct break-in to the database.`,`중앙개인등록(CPR): 이름·주소·CPR 번호 등. 데이터베이스 직접 침입은 아님.`),
 d:T(`【経緯】CPR管理当局が10/5に公表。10/2夜に9月中の不規則なアクセスを把握し、民間企業に認めていた正規の照会権限が第三者に悪用されたとして、その企業のアクセスを停止した。警察が捜査している。
【被害】約880万人の氏名、住所、CPR番号など(国外転出者や死亡者を含む登録者数)。氏名・住所の非公開保護を設定した人の氏名・住所は対象外と説明。データ保護庁は、有効なCPR番号を特定するための極めて大量の自動照会が報告されたと公表した。`,
     `[Timeline] The CPR authority announced it on 10/5. It learned on the night of 10/2 of irregular access during September, said a private company's legitimate lookup access had been abused by a third party, and suspended that company's access. Police are investigating.
[Damage] Names, addresses and CPR numbers of about 8.8 million people (a registrant count that includes people who moved abroad or died). People with name and address protection are said to be excluded. The Danish data protection agency said it received reports of extremely large automated lookups to identify valid CPR numbers.`,
     `[경과] CPR 관리 당국이 10/5 공표. 10/2 밤 9월 중 불규칙한 접근을 파악하고, 민간 기업에 허용한 정규 조회 권한이 제3자에게 악용됐다며 해당 기업의 접근을 정지했다. 경찰이 수사 중이다.
[피해] 약 880만 명의 이름, 주소, CPR 번호 등(해외 이주자·사망자를 포함한 등록자 수). 이름·주소 비공개 보호를 설정한 사람의 이름·주소는 대상 외라고 설명. 데이터보호청은 유효한 CPR 번호를 특정하기 위한 극히 대량의 자동 조회가 보고됐다고 공표했다.`),
 src:[[`デンマークCPR管理当局`,`https://www.cpr.dk/cpr-nyt/nyhedsarkiv/2026/okt/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger`],[`デンマークデータ保護庁`,`https://www.datatilsynet.dk/presse-og-nyheder/nyhedsarkiv/2026/okt/datatilsynet-er-opmaerksom-paa-sag-om-opslag-i-cpr`]]},
{id:`b15`,type:`breach`,tag:`leak`,date:`10/04`,
 h:T(`その他の主な公表(10/4〜10/9)と件数の目安`,`Other notable disclosures (10/4-10/9) and overall counts`,`그 밖의 주요 공표(10/4~10/9)와 건수 기준`),
 s:T(`ミスターマックス、セイコーマート、日本経済新聞、日水物流、ヤマト運輸、楽天(販売主張)、Oracle Healthなど。`,`Includes Mr Max, Seicomart, Nikkei, Nissui Logistics, Yamato, a claimed Rakuten data sale and Oracle Health.`,`미스터맥스, 세이코마트, 닛케이, 닛스이 물류, 야마토 운수, 라쿠텐(판매 주장), Oracle Health 등.`),
 d:T(`【会員・顧客情報】ミスターマックス(10/6):最大173万5,154人、会員ID・氏名・メール・電話など。セイコーマート(10/5第4報):アプリ会員57万4,647人分が不正閲覧された。
【アカウント侵害・業務停止】日本経済新聞社(10/4):Microsoft 365アカウントから約9,000件の不審メール。日水物流(10/7):委託先データセンターへの不正アクセスとみられ、商品の入出荷が停止。ヤマト運輸:「クロネコ代金後払い」を10/9 13時に再開し、支払期限を17日延長。情報漏えいの調査は継続(見出し情報のみ確認)。
【未確認・過去分】楽天会員1億100万件の販売を主張するハッカーの投稿(10/4報道、漏洩元と真正性は未確認)。Oracle Health(旧Cerner)は2025年の侵害で、10/2付の州当局への届出から約1,993万人規模と判明(新規攻撃ではない)。
【件数の目安】集計サイトによると、2026年9/1〜10/8の国内の公表(続報含む)は140件で、うち25件は10万件以上(SmartScope)。1月〜10/9の公表は138件との集計もある(土門大貴氏のnote)。集計方法が異なるため単純比較はできない。`,
     `[Customer data] Mr Max (10/6): up to 1,735,154 people; member ID, name, email, phone. Seicomart (4th report 10/5): 574,647 app members' data was viewed without authorization.
[Account compromise and outages] Nikkei (10/4): about 9,000 suspicious emails sent from Microsoft 365 accounts. Nissui Logistics (10/7): apparently unauthorized access to a contracted data center halted product shipping and receiving. Yamato Transport resumed its "Kuroneko deferred payment" service at 13:00 on 10/9 and extended payment deadlines by 17 days; the leak investigation continues (headline-level information only).
[Unverified and older] A hacker claims to be selling 101 million Rakuten member records (reported 10/4; source and authenticity unverified). Oracle Health (formerly Cerner) is a 2025 breach whose scale of about 19.93 million people emerged from an October 2 state filing; it is not a new attack.
[Counts] One tracker lists 140 domestic disclosures (including follow-ups) from 9/1 to 10/8, 25 of them with 100,000+ records (SmartScope); another counts 138 from January to 10/9 (note by Daiki Domon). Methods differ, so do not compare directly.`,
     `[고객 정보] 미스터맥스(10/6): 최대 173만 5,154명, 회원 ID·이름·이메일·전화번호 등. 세이코마트(10/5 제4보): 앱 회원 57만 4,647명분이 부정 열람됐다.
[계정 침해·업무 중단] 닛케이(10/4): Microsoft 365 계정에서 약 9,000건의 수상한 메일. 닛스이 물류(10/7): 위탁처 데이터센터에 대한 부정 접속으로 보이며 상품 입출하가 중단됐다. 야마토 운수: '쿠로네코 대금 후불' 서비스를 10/9 13시 재개하고 지불 기한을 17일 연장. 정보 유출 조사는 계속(헤드라인 수준만 확인).
[미확인·과거분] 라쿠텐 회원 1억 100만 건 판매를 주장하는 해커의 게시(10/4 보도, 유출원·진위 미확인). Oracle Health(구 Cerner)는 2025년 침해이며 10/2자 주 당국 신고로 약 1,993만 명 규모가 드러났다(신규 공격 아님).
[건수 기준] 한 집계 사이트에 따르면 9/1~10/8 국내 공표(속보 포함)는 140건이며 그중 25건이 10만 건 이상(SmartScope). 1월~10/9 공표가 138건이라는 집계도 있다(도몬 다이키 note). 집계 방식이 달라 단순 비교는 불가.`),
 src:[[`セキュリティ対策Lab(事例まとめ)`,`https://rocket-boys.co.jp/security-measures-lab/cyberattacks-data-breaches-latest-cases-2026/`],[`SmartScope(件数別一覧)`,`https://smartscope.blog/blog/japan-data-breach-list-tier-2026-09-10/`],[`土門大貴(note)`,`https://note.com/daikidomon/n/n238268ba8967`]]}
];
let bcFilter='all';
function renderBreach(){
  const cats=['all',...new Set(BREACH.map(b=>b.tag))];
  $('#bc-chips').innerHTML=cats.map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${c===bcFilter}">${c==='all'?esc(UI.all[LANG]):esc(UI.tags[c][LANG])}</button>`).join('');
  const q=currentQuery();
  let list=BREACH.filter(b=>bcFilter==='all'||b.tag===bcFilter);
  if(q) list=list.filter(b=>matches(b,q));
  list=list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  $('#bc-count').textContent=list.length;
  $('#bc-list').innerHTML=list.length?list.map(it=>newsItemHTML(it,null)).join(''):`<p class="empty">${esc(UI.noResults[LANG])}</p>`;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2p=s=>String(s).split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('');
const fmtChg=(v,digits=2)=>v==null?'—':(v>0?'+':'')+v.toFixed(digits)+'%';
const chgClass=v=>v==null?'flat':(v>0?'up':(v<0?'down':'flat'));
const fmtCap=v=>v==null?'—':(v>=100?Math.round(v)+`B`:(v>=1?v.toFixed(1)+`B`:Math.round(v*1000)+`M`));

function applyStatic(){
  document.title=UI.title[LANG];
  $$('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(UI[k]) el.textContent=UI[k][LANG];});
  $$('[data-i18n-ph]').forEach(el=>{const k=el.getAttribute('data-i18n-ph'); if(UI[k]) el.placeholder=UI[k][LANG];});
  $('#asof').textContent=UI.asof[LANG];
}

function renderTape(){
  const el=$('#tape');
  el.innerHTML=TAPE.map(t=>`<div class="tile" role="listitem"><div class="tl">${esc(t.l[LANG])}</div><div class="tv">${esc(t.v)}</div><div class="tc ${chgClass(t.c)}">${fmtChg(t.c)}</div>${t.d?`<div class="td">${esc(t.d)}</div>`:''}</div>`).join('');
}
function renderBrief(){
  $('#points').innerHTML=BRIEF.map(b=>`<div><b>${esc(b.h[LANG])}</b><span>${esc(b.t[LANG])}</span></div>`).join('');
  $('#cal').innerHTML=CAL.map(c=>`<li><time>${esc(c.d)}</time><span>${esc(c.t[LANG])}</span></li>`).join('');
}

function srcLine(src){
  if(!src||!src.length) return '';
  const links=src.map(([name,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>`).join('・');
  return `<p class="src"><b>${esc(UI.sources[LANG])}:</b> ${links}</p>`;
}

function codeOf(tick){return tick?tick.replace(/\.(T|TW|KS)$/,''):'';}
function nameTag(it){
  if(!it.name) return '';
  const code=codeOf(it.tick);
  const label=code?`${it.name[LANG]}（${code}）`:it.name[LANG];
  return `<span class="tkname">${esc(label)}</span>`;
}
function countryTag(it){
  if(!it.country) return '';
  return `<span class="tg cc">${FLAG[it.country]} ${esc(UI.country[it.country][LANG])}</span>`;
}
function newsItemHTML(it,quoteHTML){
  return `<div class="item" data-open="false" data-id="${it.id}">
    <button type="button" class="item-head" data-open-btn>
      <div class="ih-top">
        <span class="meta">${it.important?`<span class="tg imp">${esc(UI.important[LANG])}</span>`:''}${it.tag?`<span class="tg">${esc(UI.tags[it.tag][LANG])}</span>`:''}${countryTag(it)}${it.unlisted?`<span class="tg">${esc(UI.unlisted[LANG])}</span>`:''}${nameTag(it)}<time>${esc(it.date)}</time></span>
        <span class="ih-right">${quoteHTML?`<span class="quote">${quoteHTML}</span>`:''}<span class="chev" aria-hidden="true"></span></span>
      </div>
      <span class="h">${esc(it.h[LANG])}</span>
      <span class="s">${esc(it.s[LANG])}</span>
    </button>
    <div class="item-body"><div class="inner"><div>${nl2p(it.d[LANG])}${srcLine(it.src)}</div></div></div>
  </div>`;
}

let aiFilter='all';
function renderAIChips(){
  const cats=['all',...new Set(AI.map(a=>a.tag))];
  $('#ai-chips').innerHTML=cats.map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${c===aiFilter}">${c==='all'?esc(UI.all[LANG]):esc(UI.tags[c][LANG])}</button>`).join('');
}
function renderAI(){
  renderAIChips();
  const q=currentQuery();
  let list=AI.filter(a=>aiFilter==='all'||a.tag===aiFilter);
  if(q) list=list.filter(a=>matches(a,q));
  list=list.slice().sort((a,b)=>b.date.localeCompare(a.date));
  $('#ai-count').textContent=list.length;
  $('#ai-list').innerHTML=list.length?list.map(it=>newsItemHTML(it,null)).join(''):`<p class="empty">${esc(UI.noResults[LANG])}</p>`;
}

let stTab='saas';
let stSort='d1';
const CATTABS=['saas','semi','robo'];
function renderStockTabs(){
  const tabs=['saas','semi','robo','movers','down'];
  $('#st-tabs').innerHTML=tabs.map(k=>`<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${k===stTab}">${esc(UI.tabs[k][LANG])}</button>`).join('');
}
function renderSortSelect(){
  const wrap=$('#st-sortwrap');
  const isCat=CATTABS.includes(stTab)&&!currentQuery();
  wrap.style.display=isCat?'flex':'none';
  if(!isCat) return;
  const opts=['d1','m1','y1','mcap'];
  $('#st-sort').innerHTML=opts.map(o=>`<option value="${o}" ${o===stSort?'selected':''}>${esc(UI.sortOpt[o][LANG])}</option>`).join('');
}
function stockQuoteHTML(it){
  if(!it.px||it.px==='—') return '';
  return `<span class="px">${esc(it.px)}</span><span class="chg ${chgClass(it.chg1d)}">${fmtChg(it.chg1d)}</span>`;
}
function sortStocks(list){
  const key={d1:'chg1d',m1:'chg1m',y1:'chg1y',mcap:'mcap'}[stSort];
  return list.slice().sort((a,b)=>{
    const av=a[key],bv=b[key];
    if(av==null&&bv==null) return 0;
    if(av==null) return 1;
    if(bv==null) return -1;
    return bv-av;
  });
}
function rankItemHTML(it,idx){
  const w=Math.max(6,Math.min(100,Math.abs(it.chg)*(Math.abs(it.chg)>50?1.1:3.2)));
  const cls=chgClass(it.chg);
  return `<div class="item" data-open="false" data-id="${it.id}">
    <button type="button" class="rk-head" data-open-btn>
      <span class="rk-num">${idx+1}</span>
      <span class="rk-body">
        <span class="rk-nm">${it.important?`<span class="tg imp">${esc(UI.important[LANG])}</span>`:''}${countryTag(it)}${it.sector?`<span class="tg cc">${esc(UI.sector[it.sector][LANG])}</span>`:''}<b>${esc(it.name[LANG])}</b><em>（${esc(codeOf(it.tick))}）</em></span>
        <span class="rk-why">${esc(it.why[LANG])}</span>
        <span class="bar"><i class="${cls}" style="width:${w}%"></i></span>
      </span>
      <span class="rk-quote"><span class="px">${esc(it.px)}</span><span class="chg ${cls}">${fmtChg(it.chg)}</span>${it.date?`<span class="td">${esc(it.date)}</span>`:''}</span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="item-body"><div class="inner"><div><p>${esc(it.why[LANG])}</p>${srcLine(it.src)}</div></div></div>
  </div>`;
}
function renderStocks(){
  renderStockTabs();
  renderSortSelect();
  const q=currentQuery();
  $('#st-tabs').classList.toggle('dim',!!q);
  $('#st-note').textContent='';
  if(q){
    const cat=[...STOCKS.saas,...STOCKS.semi,...STOCKS.robo].filter(s=>matches(s,q));
    const rk=[...STOCKS.movers,...STOCKS.down].filter(s=>matches(s,q));
    $('#st-count').textContent=cat.length+rk.length;
    $('#st-list').innerHTML=(cat.length||rk.length)?(
      cat.map(it=>newsItemHTML(it,stockQuoteHTML(it))).join('')+
      rk.map((it,i)=>rankItemHTML(it,i)).join('')
    ):`<p class="empty">${esc(UI.noResults[LANG])}</p>`;
    return;
  }
  if(stTab==='movers'){
    $('#st-note').textContent=UI.moversNote[LANG];
    $('#st-count').textContent=STOCKS.movers.length;
    $('#st-list').innerHTML=STOCKS.movers.map((it,i)=>rankItemHTML(it,i)).join('');
  } else if(stTab==='down'){
    $('#st-note').textContent=UI.declinersNote[LANG];
    $('#st-count').textContent=STOCKS.down.length;
    $('#st-list').innerHTML=STOCKS.down.map((it,i)=>rankItemHTML(it,i)).join('');
  } else {
    const list=sortStocks(STOCKS[stTab]);
    $('#st-count').textContent=list.length;
    $('#st-list').innerHTML=list.map(it=>newsItemHTML(it,stockQuoteHTML(it))).join('');
  }
}

function renderMacro(){
  const q=currentQuery();
  let list=MACRO.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(q) list=list.filter(m=>matches(m,q));
  $('#mc-count').textContent=list.length;
  $('#mc-list').innerHTML=list.length?list.map(it=>newsItemHTML(it,null)).join(''):`<p class="empty">${esc(UI.noResults[LANG])}</p>`;
}

function currentQuery(){return ($('#q').value||'').trim().toLowerCase();}
function matches(it,q){
  const hay=[it.h&&it.h[LANG],it.s&&it.s[LANG],it.d&&it.d[LANG],it.tick,it.name&&it.name[LANG],it.why&&it.why[LANG]].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function renderAll(){renderTape();renderBrief();renderAI();renderStocks();renderMacro();renderBreach();applyStatic();}

document.addEventListener('click',e=>{
  const openBtn=e.target.closest('[data-open-btn]');
  if(openBtn){
    const item=openBtn.closest('.item');
    item.dataset.open=item.dataset.open==='true'?'false':'true';
    return;
  }
  const chip=e.target.closest('#ai-chips .chip');
  if(chip){aiFilter=chip.dataset.cat;renderAI();return;}
  const bchip=e.target.closest('#bc-chips .chip');
  if(bchip){bcFilter=bchip.dataset.cat;renderBreach();return;}
  const tab=e.target.closest('#st-tabs .tab');
  if(tab){stTab=tab.dataset.tab;renderStocks();return;}
  const langBtn=e.target.closest('[data-lang]');
  if(langBtn){
    LANG=langBtn.dataset.lang;
    document.documentElement.lang=LANG;
    document.documentElement.dataset.lang=LANG;
    $$('.seg button[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
    renderAll();
    return;
  }
});
$('#q').addEventListener('input',()=>{renderAI();renderStocks();renderMacro();renderBreach();});
$('#st-sort').addEventListener('change',e=>{stSort=e.target.value;renderStocks();});

renderAll();
</script>
</body>
</html>
